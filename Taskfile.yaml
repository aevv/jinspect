version: "3"

vars:
  NUPKG_DIR: ./nupkg

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  bench:
    desc: Run benchmarks
    cmds:
      - dotnet run -c Release --project tests/JInspect.Benchmarks

  build:
    desc: Build the project
    cmds:
      - dotnet build

  test:
    desc: Run all tests
    cmds:
      - dotnet test

  fixtures:
    desc: List available fixtures
    silent: true
    cmds:
      - powershell -NoProfile -Command "Get-ChildItem tests/JInspect.Tests/Fixtures -Filter *.json | Select-Object -ExpandProperty BaseName"

  run:
    desc: "Run jinspect against a fixture (usage: task run -- <fixture-name> [-q])"
    cmds:
      - dotnet run --project JInspect.csproj -- tests/JInspect.Tests/Fixtures/{{.CLI_ARGS}}.json

  run:query:
    desc: "Print the command to run jinspect against a fixture in query mode (usage: task run:query -- <fixture-name>)"
    silent: true
    cmds:
      - powershell -NoProfile -Command "Write-Host 'dotnet run --project JInspect.csproj -- tests/JInspect.Tests/Fixtures/{{.CLI_ARGS}}.json -q'"

  pack:
    desc: Pack the NuGet package
    cmds:
      - dotnet pack -c Release -o {{.NUPKG_DIR}}

  publish:
    desc: Pack and publish to NuGet
    deps: [test, pack]
    preconditions:
      - sh: '[ -n "{{.NUGET_API_KEY}}" ]'
        msg: "NUGET_API_KEY is not set"
    cmds:
      - dotnet nuget push {{.NUPKG_DIR}}/*.nupkg --api-key {{.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate

  release:
    desc: Create a GitHub release from the version in the csproj
    vars:
      VERSION:
        sh: powershell -NoProfile -Command "([xml](Get-Content JInspect.csproj)).Project.PropertyGroup.Version"
    cmds:
      - gh release create v{{.VERSION}} --title "v{{.VERSION}}" --generate-notes
    preconditions:
      - sh: '! gh release view v{{.VERSION}} > /dev/null 2>&1'
        msg: "Release v{{.VERSION}} already exists"
